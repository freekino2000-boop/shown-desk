<title>쇼앤 기사 공장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --바닥:#e9edf0; --판:#ffffff; --잉크:#131c24; --흐림:#5c6b76; --옅음:#8d9aa4;
  --선:#c3ccd3; --실선:#dde3e8;
  --남:#0b3d5c; --빨:#b3251e; --호박:#a8730a; --초록:#2f7d54;
  --남물:#e6eef3; --빨물:#fbeceb; --쇠:#9aa7b0;
  --명조:"Nanum Myeongjo",Batang,"Apple SD Gothic Neo",serif;
  --고딕:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --숫자:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --바닥:#0c1217; --판:#141d24; --잉크:#e6edf2; --흐림:#98a8b3; --옅음:#6d7f8c;
  --선:#293742; --실선:#1d2831;
  --남:#6db2dd; --빨:#e5726a; --호박:#d9a441; --초록:#5fbf8c;
  --남물:#15303f; --빨물:#33201f; --쇠:#4a5a66;
}}
:root[data-theme="dark"]{
  --바닥:#0c1217; --판:#141d24; --잉크:#e6edf2; --흐림:#98a8b3; --옅음:#6d7f8c;
  --선:#293742; --실선:#1d2831;
  --남:#6db2dd; --빨:#e5726a; --호박:#d9a441; --초록:#5fbf8c;
  --남물:#15303f; --빨물:#33201f; --쇠:#4a5a66;
}
*{box-sizing:border-box}
body{background:var(--바닥);color:var(--잉크);font-family:var(--고딕);line-height:1.55;
     -webkit-text-size-adjust:100%}
.판{max-width:560px;margin:0 auto;padding:0 14px 60px}

/* ── 간판 ── */
header{position:sticky;top:0;z-index:9;background:var(--바닥);padding:15px 0 10px;
       border-bottom:1px solid var(--선)}
.간판{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.간판 h1{margin:0;font-family:var(--명조);font-weight:800;font-size:22px;letter-spacing:-.02em}
.간판 time{font-family:var(--숫자);font-size:11.5px;color:var(--흐림);white-space:nowrap}
.계기{display:flex;margin-top:11px;border:1px solid var(--선);border-radius:4px;
      overflow:hidden;background:var(--판)}
.계기 div{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--실선)}
.계기 div:last-child{border-right:0}
.계기 b{display:block;font-family:var(--숫자);font-size:19px;font-weight:600;
        font-variant-numeric:tabular-nums;line-height:1.15}
.계기 span{display:block;font-size:10px;color:var(--흐림);letter-spacing:.05em;margin-top:2px}
.계-속 b{color:var(--빨)} .계-브 b{color:var(--남)} .계-내 b{color:var(--옅음)}

/* ── 공장 라인 ── */
.공장{position:relative;margin:18px 0 6px;padding:16px 0 10px}
.공장::before{content:"";position:absolute;left:31px;top:26px;bottom:26px;width:6px;
  background:repeating-linear-gradient(180deg,var(--쇠),var(--쇠) 9px,transparent 9px,transparent 16px);
  border-radius:3px;opacity:.55}
.칸{position:relative;display:grid;grid-template-columns:66px 1fr;gap:12px;
    align-items:center;padding:9px 0}
.자리{position:relative;width:66px;height:64px}

/* 미니어처 사람 — 순수 CSS */
.사람{position:absolute;left:14px;bottom:4px;width:38px;height:52px}
.머리{position:absolute;left:11px;top:0;width:16px;height:16px;border-radius:50%;
      background:#e7c39d;border:2px solid var(--잉크)}
.머리::after{content:"";position:absolute;left:-2px;top:-3px;width:20px;height:9px;
      border-radius:9px 9px 0 0;background:var(--잉크)}
.몸{position:absolute;left:7px;top:17px;width:24px;height:24px;border-radius:7px 7px 4px 4px;
    border:2px solid var(--잉크);background:var(--역할,#8fb3c9)}
.팔{position:absolute;top:20px;width:7px;height:15px;border-radius:4px;
    border:2px solid var(--잉크);background:var(--역할,#8fb3c9);transform-origin:top center}
.팔.좌{left:1px} .팔.우{right:1px}
.다리{position:absolute;top:40px;width:9px;height:12px;border-radius:0 0 4px 4px;
      border:2px solid var(--잉크);background:#37485a}
.다리.좌{left:8px} .다리.우{right:8px}
.연장{position:absolute;right:-6px;top:16px;width:14px;height:14px;border-radius:3px;
      border:2px solid var(--잉크);background:var(--연장색,#f0c04a);transform:rotate(-14deg)}
.대기 .사람{opacity:.45;filter:grayscale(.7)}
@keyframes 들썩{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes 팔짓{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-26deg)}}
.일하는 .사람{animation:들썩 1.6s ease-in-out infinite}
.일하는 .팔.우{animation:팔짓 1.1s ease-in-out infinite}

/* 작업대 */
.대{background:var(--판);border:1px solid var(--실선);border-left:4px solid var(--쇠);
    border-radius:4px;padding:9px 11px}
.대.속{border-left-color:var(--빨)} .대.브{border-left-color:var(--남)}
.대 .머리줄{display:flex;align-items:baseline;gap:7px}
.대 h2{margin:0;font-family:var(--명조);font-size:15.5px;font-weight:700}
.대 .번{font-family:var(--숫자);font-size:11px;color:var(--옅음)}
.대 .통과{margin-left:auto;font-family:var(--숫자);font-size:11.5px;color:var(--초록);
          font-variant-numeric:tabular-nums}
.대 p{margin:3px 0 0;font-size:11.5px;color:var(--흐림)}
.막대{margin-top:7px;height:5px;border-radius:3px;background:var(--실선);overflow:hidden}
.막대 i{display:block;height:100%;background:var(--초록);border-radius:3px}

/* 벨트 위의 기사 토큰 */
.토큰{position:absolute;left:24px;width:16px;height:20px;border-radius:2px;
      border:1.5px solid var(--잉크);background:#fff;z-index:3}
.토큰.속{background:var(--빨물);border-color:var(--빨)}
.토큰.브{background:var(--남물);border-color:var(--남)}
@keyframes 흐름{
  0%{top:-14px;opacity:0} 6%{opacity:1}
  94%{opacity:1} 100%{top:calc(100% + 6px);opacity:0}}
.흐르는{animation:흐름 var(--시간,14s) linear infinite}

/* ── 기사 목록 ── */
.목록{margin-top:22px;border-top:1px solid var(--선);padding-top:15px}
.목록 h3{margin:0 0 9px;font-family:var(--명조);font-size:15px}
.줄{display:flex;flex-direction:column;gap:8px}
article{background:var(--판);border:1px solid var(--실선);border-left:4px solid var(--남);
        border-radius:4px;padding:10px 11px}
article.속{border-left-color:var(--빨)}
.위{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.칩{font-size:10px;font-weight:700;letter-spacing:.07em;padding:2px 6px;border-radius:2px;
    background:var(--남물);color:var(--남)}
.속 .칩{background:var(--빨물);color:var(--빨)}
.no{font-family:var(--숫자);font-size:11px;color:var(--옅음)}
.트랙{margin-left:auto;font-size:10.5px;color:var(--옅음)}
article h4{margin:0 0 4px;font-family:var(--명조);font-size:15px;font-weight:700;line-height:1.4;
           text-wrap:balance}
article h4 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--선)}
article h4 a:focus-visible{outline:2px solid var(--호박);outline-offset:2px}
.발단{margin:0;font-size:11px;color:var(--옅음)}
.수치{display:flex;gap:12px;margin-top:7px;padding-top:6px;border-top:1px solid var(--실선);
      font-family:var(--숫자);font-size:11px;font-variant-numeric:tabular-nums;color:var(--옅음)}
.수치 b{color:var(--잉크);font-weight:600}
.수치 .온 b{color:var(--호박)} .수치 .점 b{color:var(--초록)}

/* ── 내린 것 ── */
.폐기{margin-top:20px;border-top:1px solid var(--선);padding-top:14px}
.폐기 h3{margin:0 0 3px;font-family:var(--명조);font-size:14.5px}
.폐기 p{margin:0 0 9px;font-size:11.5px;color:var(--흐림);line-height:1.6}
.폐기 ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.폐기 li{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--흐림);
         background:var(--판);border:1px dashed var(--선);border-radius:4px;padding:8px 10px}
.폐기 li em{font-family:var(--숫자);font-size:10.5px;color:var(--옅음);font-style:normal;
            text-decoration:line-through}
footer{margin-top:22px;font-size:10.5px;color:var(--옅음);line-height:1.7;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  {n:1, 역:"수집가",    색:"#7fa8c4", 연장:"#f0c04a", 일:"원문을 열고 수치를 옮긴다"},
  {n:2, 역:"초고작성",  색:"#8fbf9f", 연장:"#e08a5a", 일:"영문 초고를 세운다"},
  {n:3, 역:"검수왕",    색:"#c9a06a", 연장:"#b3251e", 일:"원장과 대조해 세 번 본다"},
  {n:4, 역:"번역기자",  색:"#9aa9d6", 연장:"#5fbf8c", 일:"국문으로 옮긴다"},
  {n:5, 역:"기자",      색:"#d69a9a", 연장:"#0b3d5c", 일:"지면 규격으로 쓴다"},
  {n:6, 역:"이미지작가", 색:"#b79ad6", 연장:"#f0c04a", 일:"표지를 그리고 얹는다"},
  {n:7, 역:"데스크",    색:"#6f8a9c", 연장:"#b3251e", 일:"채점하고 판정한다"},
  {n:8, 역:"발행",      색:"#8fb37f", 연장:"#2f7d54", 일:"지면에 낸다"}
];

function 사람(공, 상태){
  return `<div class="자리 ${상태}">
    <div class="사람" style="--역할:${공.색};--연장색:${공.연장}">
      <div class="팔 좌"></div><div class="팔 우"></div>
      <div class="다리 좌"></div><div class="다리 우"></div>
      <div class="몸"></div><div class="머리"></div><div class="연장"></div>
    </div></div>`;
}

function 공장그리기(기사들){
  const 총 = 기사들.length;
  const 판 = 공정.map(공 => {
    const 지남 = 기사들.filter(a => {
      const s = (a.stages || []).find(x => x.n === 공.n);
      return s ? s.done : false;
    }).length;
    // 속보는 3번(검수왕)을 규격대로 건너뛴다 — 분모에서 뺀다
    const 해당 = 공.n === 3 ? 기사들.filter(a => a.sec !== "속보").length : 총;
    const 상태 = 해당 === 0 ? "대기" : (지남 >= 해당 ? "끝난" : "일하는");
    const 몫 = 해당 ? Math.round(지남 / 해당 * 100) : 0;
    return `<div class="칸">
      ${사람(공, 상태)}
      <div class="대 ${공.n === 8 ? "속" : "브"}">
        <div class="머리줄"><span class="번">${String(공.n).padStart(2,"0")}</span>
          <h2>${공.역}</h2><span class="통과">${지남}/${해당}</span></div>
        <p>${공.일}</p>
        <div class="막대"><i style="width:${몫}%"></i></div>
      </div></div>`;
  }).join("");

  const 토큰 = 기사들.slice(0, 8).map((a, i) =>
    `<span class="토큰 ${a.sec === "속보" ? "속" : "브"} 흐르는"
       style="--시간:${13 + (i % 4) * 2.5}s;animation-delay:${(i * 1.7).toFixed(1)}s"
       title="${a.no}"></span>`).join("");
  document.getElementById("공장").innerHTML = 판 + 토큰;
}

function 기사그리기(기사들){
  document.getElementById("줄").innerHTML = 기사들.map(a => {
    const 속 = a.sec === "속보";
    const url = `https://www.shown.co.kr/news/articleView.html?idxno=${a.no}`;
    return `<article class="${속 ? "속" : ""}">
      <div class="위"><span class="칩">${a.sec}</span><span class="no">${a.no}</span>
        <span class="트랙">${a.track || ""}</span></div>
      <h4><a href="${url}" target="_blank" rel="noopener">${a.title}</a></h4>
      <p class="발단">발단 · ${a.origin || "—"}</p>
      <div class="수치"><span class="점">데스크 <b>${a.score ?? "—"}</b></span>
        <span class="온">검색 <b>${a.temp ?? "—"}</b>도</span>
        <span>출처 <b>${a.urls ?? 0}</b>건</span></div>
    </article>`;
  }).join("");
}

(function(){
  const 낸 = 자료.낸것 || [], 뺀 = 자료.뺀것 || [];
  const 속 = 낸.filter(a => a.sec === "속보").length;
  const 점 = 낸.map(a => a.score).filter(n => typeof n === "number");
  document.getElementById("ㄱ속").textContent = 속;
  document.getElementById("ㄱ브").textContent = 낸.length - 속;
  document.getElementById("ㄱ점").textContent =
    점.length ? (점.reduce((x, y) => x + y, 0) / 점.length).toFixed(1) : "—";
  document.getElementById("ㄱ내").textContent = 뺀.length;
  document.getElementById("때").textContent =
    new Date().toLocaleString("ko-KR", {month:"long", day:"numeric", hour:"2-digit", minute:"2-digit"});
  공장그리기(낸);
  기사그리기(낸);
  document.getElementById("폐기").innerHTML =
    뺀.map(a => `<li><em>${a.no || "—"}</em><span>${a.title}</span></li>`).join("");
})();
</script>
