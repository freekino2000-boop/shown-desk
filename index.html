<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>쇼앤 편집국 — AI 팀원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 폰 판(공개) — tools/현황판올리기.py 가 스크립트 첫 줄의 «자료» 한 줄만 갈아 끼운다.
     공개 주소(shown.lincre.ai · desk.lincre.ai · GitHub Pages)로 나가므로 봇 상태·시각·건수만 싣는다.
     메모·기사 제목·폴더 이름은 싣지 않는다(2026-09-27 리디자인에서도 그대로). -->
<style>
:root{--ground:#f7f4ee;--card:#fff;--ink:#26242f;--muted:#8b8794;--line:#ece7de;--soft:#f6f3ed;
  --live:#b8740f;--live-s:#fff4dc;--pass:#2f9a5d;--pass-s:#e4f6ea;--fail:#d44848;--fail-s:#fde8e8;--stale:#e2701f;--stale-s:#ffeadb;
  --shadow:0 1px 2px rgba(60,48,30,.04),0 10px 30px rgba(60,48,30,.06);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 110px}
header{display:flex;align-items:center;gap:10px;padding:4px 2px 14px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#ffd9a8,#f7b7d2 55%,#c9b8ff);display:grid;place-items:center;font-weight:800;color:#fff}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
header .sub{font-size:12px;color:var(--muted)}
header time{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(236,231,222,.7)}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.team{padding:6px 8px 10px}
.team h2,.sec h2{display:flex;align-items:center;gap:8px;margin:0;padding:12px 10px 8px;font-size:14px}
.cnt{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.mem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:14px;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mem.on{background:#fbf5ee;box-shadow:inset 0 0 0 1px #f1e6d8}
.mem b{display:block;font-size:13.5px}
.mem span.r{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;overflow:hidden;background:var(--bg,#eee);flex:none}
.av img{width:100%;height:100%;display:block}
.av.lg{width:72px;height:72px;border-radius:22px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:#f1efeb;color:#85818d}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live{background:var(--live-s);color:var(--live)}.pill.pass{background:var(--pass-s);color:var(--pass)}
.pill.fail{background:var(--fail-s);color:var(--fail)}.pill.stale{background:var(--stale-s);color:var(--stale)}
.pill.none{background:#f8f7f5;color:#b0acb6;box-shadow:inset 0 0 0 1px #ebe8e3}.pill.none i{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.prof{padding:16px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.prof .nm{font-size:17px;font-weight:800;letter-spacing:-.02em}
.prof .rl{font-size:12px;font-weight:600}
.prof .ds{font-size:12px;color:var(--muted);margin:3px 0 6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:12px 13px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);border:1px solid rgba(236,231,222,.7);min-width:0}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;color:#2f9a6b;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.na{color:#c3bfc8}.stat b.warm{color:#c7811a}.stat b.bad{color:var(--fail)}.stat b.ink{color:var(--ink);font-size:19px}
.stat .lb{display:block;font-size:11.5px;font-weight:600}
.stat .sb{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{padding:4px 12px 12px}
.flow{display:flex;flex-direction:column;gap:6px;padding:2px 2px 4px}
.fl{display:grid;grid-template-columns:32px 64px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12px;border:0;background:none;padding:3px 2px;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:10px}
.fl .av{width:32px;height:32px;border-radius:10px}
.fl .bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.fl .bar i{display:block;height:100%;border-radius:8px;background:#b9adf2}
.fl .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.fl .n .bad{color:var(--fail);font-weight:700}
.pub{display:flex;flex-direction:column}
.pub a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid #f2eee7;color:inherit;text-decoration:none;font-size:12.5px}
.pub a:first-child{border-top:0}
.pub .no{font-weight:700;color:#6a5ae0;font-variant-numeric:tabular-nums}
.pub .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pub .k{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#efecfd;color:#6a5ae0}
.pub .k.s{background:#fdecea;color:#b42318}
.none{color:var(--muted);font-size:12px;padding:6px}
footer{margin-top:16px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:7px 9px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(60,48,30,.14);border:1px solid rgba(236,231,222,.8);max-width:calc(100vw - 16px);overflow-x:auto;z-index:9}
.dk{position:relative;border:0;padding:2px;border-radius:14px;background:none;cursor:pointer;flex:none}
.dk .av{width:36px;height:36px;border-radius:11px}
.dk.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ring,#c9b8ff)}
.dk .dot{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:#d6d2cc}
.dk .dot.k-live{background:#f2b33d}.dk .dot.k-pass{background:#3fb27f}.dk .dot.k-fail{background:#e05252}.dk .dot.k-stale{background:#f08a3c}.dk .dot.k-idle{background:#b9b4ad}
.dk .dot.k-none{background:#fff;box-shadow:inset 0 0 0 1.5px #d6d2cc}
@media (max-width:420px){.dock{gap:3px;padding:6px 7px}.dk .av{width:34px;height:34px}}
@media (min-width:900px){.dock{display:none}.wrap{padding-bottom:40px}}
@media (max-width:899px){.grid{grid-template-columns:minmax(0,1fr)}.team{display:none}.stats{grid-template-columns:1fr 1fr}header .sub{display:none}}
</style>
</head>
