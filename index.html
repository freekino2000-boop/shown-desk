<title>쇼앤 편집국 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#f4f6f8; --card:#ffffff; --ink:#131c24; --dim:#5c6b76; --faint:#8b99a4;
  --line:#c9d2d9; --hair:#e2e8ec;
  --navy:#0b3d5c; --red:#b3251e; --amber:#a8730a; --good:#2f7d54;
  --navy-wash:#e7eef3; --red-wash:#fbeceb;
  --serif:"Nanum Myeongjo",Batang,"Apple SD Gothic Neo",serif;
  --sans:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0d141a; --card:#151f27; --ink:#e6edf2; --dim:#9aabb6; --faint:#6f8290;
  --line:#2a3844; --hair:#1e2a34;
  --navy:#6db2dd; --red:#e5726a; --amber:#d9a441; --good:#5fbf8c;
  --navy-wash:#16303f; --red-wash:#33201f;
}}
:root[data-theme="dark"]{
  --paper:#0d141a; --card:#151f27; --ink:#e6edf2; --dim:#9aabb6; --faint:#6f8290;
  --line:#2a3844; --hair:#1e2a34;
  --navy:#6db2dd; --red:#e5726a; --amber:#d9a441; --good:#5fbf8c;
  --navy-wash:#16303f; --red-wash:#33201f;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
     -webkit-text-size-adjust:100%;line-height:1.55}
.wrap{max-width:540px;margin:0 auto;padding:0 14px 56px}

/* ── 머리 ── */
header{position:sticky;top:0;z-index:5;background:var(--paper);
       padding:16px 0 10px;border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mast h1{margin:0;font-family:var(--serif);font-weight:800;font-size:23px;letter-spacing:-.01em}
.mast time{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.tally{display:flex;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:3px;
       overflow:hidden;background:var(--card)}
.tally div{flex:1;padding:9px 6px;text-align:center;border-right:1px solid var(--hair)}
.tally div:last-child{border-right:0}
.tally b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;
         font-variant-numeric:tabular-nums;line-height:1.2}
.tally span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.06em;margin-top:2px}
.t-sok b{color:var(--red)} .t-bri b{color:var(--navy)} .t-out b{color:var(--faint)}

/* ── 거르개 ── */
.filters{display:flex;gap:6px;margin:12px 0 4px}
.filters button{flex:1;min-height:44px;font-family:var(--sans);font-size:13px;font-weight:600;
  color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:3px;
  cursor:pointer;padding:0 4px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── 기사 ── */
.list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
article{background:var(--card);border:1px solid var(--hair);border-left:4px solid var(--navy);
        border-radius:3px;padding:13px 13px 11px}
article.sok{border-left-color:var(--red)}
.top{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2.5px 7px;border-radius:2px;
      background:var(--navy-wash);color:var(--navy)}
.sok .chip{background:var(--red-wash);color:var(--red)}
.no{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.track{font-size:11px;color:var(--faint);margin-left:auto}
h2{margin:0 0 6px;font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.4;
   letter-spacing:-.01em;text-wrap:balance}
h2 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
h2 a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lead{margin:0;font-size:13px;color:var(--dim);line-height:1.6}
.origin{margin:9px 0 0;font-size:11.5px;color:var(--faint)}
.origin b{color:var(--dim);font-weight:600}

/* ── 8단계 레일 ── */
.rail{display:flex;gap:2px;margin:11px 0 8px}
.rail i{flex:1;height:5px;background:var(--hair);border-radius:1px}
.rail i.on{background:var(--navy)}
.sok .rail i.on{background:var(--red)}
.rail i.skip{background:repeating-linear-gradient(45deg,var(--hair),var(--hair)2px,transparent 2px,transparent 4px)}
.roles{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);letter-spacing:-.02em}

/* ── 수치 ── */
.nums{display:flex;gap:14px;margin-top:10px;padding-top:9px;border-top:1px solid var(--hair);
      font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.nums span{color:var(--faint)}
.nums b{font-weight:600;color:var(--ink)}
.nums .hot b{color:var(--amber)}
.nums .pass b{color:var(--good)}

/* ── 내린 기사 ── */
.out{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.out h3{margin:0 0 3px;font-family:var(--serif);font-size:15px;font-weight:700}
.out p{margin:0 0 11px;font-size:12px;color:var(--dim);line-height:1.6}
.out ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.out li{display:flex;gap:9px;align-items:baseline;font-size:13px;color:var(--dim);
        background:var(--card);border:1px solid var(--hair);border-radius:3px;padding:9px 11px}
.out li em{font-family:var(--mono);font-size:11px;color:var(--faint);font-style:normal;
           text-decoration:line-through}
footer{margin-top:24px;font-size:11px;color:var(--faint);line-height:1.7;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const 역할 = ["수집","초고","검수","번역","기사","이미지","데스크","발행"];

function 기사판(a){
  const 속보 = a.sec === "속보";
  const rail = a.stages.map(s => {
    const 건너뜀 = 속보 && s.n === 3 && !s.done;
    return `<i class="${건너뜀 ? "skip" : (s.done ? "on" : "")}"></i>`;
  }).join("");
  const url = `https://www.shown.co.kr/news/articleView.html?idxno=${a.no}`;
  return `<article class="${속보 ? "sok" : ""}">
    <div class="top"><span class="chip">${a.sec}</span>
      <span class="no">${a.no}</span><span class="track">${a.track}</span></div>
    <h2><a href="${url}" target="_blank" rel="noopener">${a.title}</a></h2>
    <p class="lead">${a.lead}</p>
    <div class="rail">${rail}</div>
    <div class="roles">${역할.map(r => `<span>${r}</span>`).join("")}</div>
    <p class="origin"><b>발단</b> ${a.origin || "—"}</p>
    <div class="nums">
      <span class="pass">데스크 <b>${a.score ?? "—"}</b>/100</span>
      <span class="hot">검색 <b>${a.temp ?? "—"}</b>도</span>
      <span>출처 <b>${a.urls}</b>건</span>
    </div>
  </article>`;
}

function 그린다(거르개){
  const 것들 = 거르개 === "all" ? 자료.낸것 : 자료.낸것.filter(a => a.sec === 거르개);
  document.getElementById("list").innerHTML = 것들.map(기사판).join("");
}

const 속보수 = 자료.낸것.filter(a => a.sec === "속보").length;
const 점수들 = 자료.낸것.map(a => a.score).filter(n => typeof n === "number");
document.getElementById("n-sok").textContent = 속보수;
document.getElementById("n-bri").textContent = 자료.낸것.length - 속보수;
document.getElementById("n-avg").textContent = 점수들.length
  ? (점수들.reduce((x, y) => x + y, 0) / 점수들.length).toFixed(1) : "—";
document.getElementById("n-out").textContent = 자료.뺀것.length;
document.getElementById("out").innerHTML = 자료.뺀것
  .map(a => `<li><em>${a.no}</em><span>${a.title}</span></li>`).join("");

document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".filters button")
    .forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  그린다(b.dataset.f);
}));
그린다("all");
